name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go:
          - "1.22"
          - "1.23"
          - "1.24"
          - "1.25"
          - "1.26"
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Get dependencies
        run: go get -v -t -d ./...

      # Prefer the official action over install.sh+latest: the install script
      # verifies GitHub release checksums and "latest" occasionally fails when
      # the published asset and checksum metadata drift.
      - name: Lint
        uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: v2.1.6
          args: ./...

      - name: Test
        run: make test

      - name: Bench
        run: make bench
