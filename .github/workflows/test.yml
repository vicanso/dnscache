name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go:
          - "1.22"
          - "1.23"
          - "1.24"
          - "1.25"
          - "1.26"
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Get dependencies
        run: go get -v -t -d ./...

      # Use action v9+ (Node 24). v8 runs on Node 20, which GitHub Actions
      # deprecates and warns about on current runners.
      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.11.4
          args: ./...

      - name: Test
        run: make test

      - name: Bench
        run: make bench
